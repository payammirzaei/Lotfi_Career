# Local / self-hosted stack: PostgreSQL + app, both with persistent named volumes.
#   cp .env.example .env   (set SECRET_KEY and POSTGRES_PASSWORD)
#   docker compose up -d --build
#
# Multi-application: several apps can share the "db" service. Give each one its
# own DB_SCHEMA (e.g. career, shop) and its own uploads volume.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-career}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-career}
      DB_SCHEMA: ${DB_SCHEMA:-career}
      UPLOAD_PATH: /usr/src/app/uploads
      # Set to true once the app is served behind HTTPS
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - uploads:/usr/src/app/uploads

volumes:
  pgdata:
  uploads:
