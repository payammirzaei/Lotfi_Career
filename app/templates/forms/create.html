{% extends "base.html" %}

{% block title %}New job ad{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">New job ad</h1>
    
    <form method="POST" action="{{ url_for('forms.create') }}" class="bg-white rounded-lg shadow-lg p-6">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="space-y-6">
            <!-- Title -->
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                    Job title <span class="text-red-500">*</span>
                </label>
                <input type="text" id="title" name="title" required maxlength="200" value="{{ request.form.get('title', '') }}"
                       class="w-full rounded-lg border-gray-300 focus:border-indigo-500 focus:ring-indigo-500"
                       placeholder="e.g. Piano Sales Consultant">
            </div>
            
            <!-- Description -->
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                    Description
                </label>
                <textarea id="description" name="description" rows="3"
                          class="w-full rounded-lg border-gray-300 focus:border-indigo-500 focus:ring-indigo-500"
                          placeholder="Short summary shown on the careers page (optional)">{{ request.form.get('description', '') }}</textarea>
            </div>

            {% include "forms/_ad_details.html" %}

            {% set template_value = default_template %}
            {% include "forms/_template_editor.html" %}

            <!-- Buttons -->
            <div class="flex space-x-4 pt-4">
                <button type="submit" class="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition-colors duration-200">
                    <i class="fas fa-save mr-2"></i>Create job ad
                </button>
                <a href="{{ url_for('admin.ads' if current_user.is_admin else 'forms.index') }}" class="flex-1 text-center bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-300 transition-colors duration-200">
                    Cancel
                </a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
