<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ form.title }} – closed</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo-EN.svg') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face { font-family: 'Vazirmatn'; src: url('{{ url_for("static", filename="fonts/variable/Vazirmatn[wght].ttf") }}') format('truetype'); font-weight: 100 900; font-display: swap; }
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <img src="{{ url_for('static', filename='images/logo-EN.svg') }}" alt="Lotfi Piano Gallery" class="h-14 w-auto mx-auto mb-8">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <span class="inline-flex w-12 h-12 rounded-full bg-gray-100 items-center justify-center mb-4"><i class="fas fa-lock text-gray-500"></i></span>
            <h1 class="text-xl font-semibold text-gray-900">{{ form.title }}</h1>
            <p class="text-gray-600 mt-2">This position is no longer accepting applications.</p>
            {% if form.closes_at %}<p class="text-sm text-gray-400 mt-1">Applications closed on {{ form.closes_at.strftime('%B %d, %Y') }}.</p>{% endif %}
        </div>
    </div>
</body>
</html>
